<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
    <style>
    .highlighted {
      font-weight: bold;
      color: red;
    }
    text {
      font-size: 10px;
      font-family: monospace;
      user-select: none;
    }
    </style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section>
          Caesar Cipher
          <div id="app"></div>
        </section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.js"
        }
      }
    </script>
    <script type="module">
      import { createApp, ref } from 'vue'
      import CaesarWheel from './caesar-wheel.js'
      import CaesarStrip from './caesar-strip.js'
      createApp({
        components: { CaesarWheel, CaesarStrip },
        template: `
          <input type=number min=0 v-model="shift"/>
          <CaesarWheel highlight="A" :shift="shift"></CaesarWheel>
          <CaesarStrip highlight="A" :shift="shift"></CaesarStrip>
        `,
        setup() {
          const shift = ref(0);

          return {shift}
        },
      }).mount('#app')
    </script>

	</body>
</html>
